<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KelivaX AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            background-color: #131314;
            color: #e3e3e3;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Design */
        .sidebar {
            width: 260px;
            background-color: #1e1f20;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #4285f4, #9b51e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-chat-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 30px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            transition: 0.3s;
        }

        .new-chat-btn:hover {
            background: #2a2a2a;
        }

        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #131314;
            position: relative;
        }

        .chat-container {
            flex: 1;
            padding: 40px 20% 120px 20%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Responsive padding for smaller screens */
        @media (max-width: 900px) {
            .chat-container { padding: 20px 5% 120px 5%; }
            .sidebar { display: none; } /* Hides sidebar on mobile */
        }

        /* Chat Bubbles */
        .message {
            display: flex;
            gap: 20px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user-message .avatar {
            background-color: #5c6bc0;
        }

        .ai-message .avatar {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
        }

        .content {
            line-height: 1.6;
            font-size: 16px;
            color: #e3e3e3;
            padding-top: 5px;
            white-space: pre-wrap;
        }

        /* Bottom Input Container */
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 20%;
            background: linear-gradient(transparent, #131314 30%);
        }

        @media (max-width: 900px) {
            .input-container { padding: 10px 5%; }
        }

        .input-box {
            display: flex;
            background-color: #1e1f20;
            border-radius: 30px;
            padding: 10px 20px;
            align-items: center;
            border: 1px solid transparent;
        }

        .input-box:focus-within {
            border-color: #444;
        }

        input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            padding: 10px;
            outline: none;
        }

        input::placeholder {
            color: #80868b;
        }

        button {
            background: none;
            border: none;
            color: #4285f4;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 10px;
            transition: 0.2s;
        }

        button:hover {
            color: #8ab4f8;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #131314; }
        ::-webkit-scrollbar-thumb { background: #3c4043; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="brand">KelivaX</div>
            <div class="new-chat-btn" onclick="clearChat()">+ New Chat</div>
        </div>
        <div style="font-size: 12px; color: #80868b; text-align: center;">Powered by Hugging Face</div>
    </div>

    <div class="chat-area">
        <div class="chat-container" id="chatContainer">
            <div class="message ai-message">
                <div class="avatar">K</div>
                <div class="content">Hello! I am KelivaX. How can I help you today?</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <input type="text" id="userInput" placeholder="Message KelivaX..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
