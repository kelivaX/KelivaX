<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KelivaX</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #212121; color: #ececec; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 260px; background: #171717; display: flex; flex-direction: column; padding: 12px; gap: 6px; flex-shrink: 0; }
    .sidebar-title { color: white; font-size: 18px; font-weight: 700; padding: 10px 8px 16px; border-bottom: 1px solid #2f2f2f; margin-bottom: 6px; }
    .new-chat { background: transparent; border: 1px solid #2f2f2f; color: #ececec; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
    .new-chat:hover { background: #2f2f2f; }
    .sidebar-footer { margin-top: auto; font-size: 12px; color: #555; padding: 8px; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Chat */
    .chat-area { flex: 1; overflow-y: auto; padding: 32px 20%; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 3px; }

    /* Welcome */
    .welcome { text-align: center; margin: auto; padding: 40px 20px; }
    .welcome h1 { font-size: 36px; font-weight: 700; margin-bottom: 10px; background: linear-gradient(135deg, #19c37d, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .welcome p { color: #666; font-size: 16px; margin-bottom: 32px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .suggestion-btn { background: #2f2f2f; border: 1px solid #3f3f3f; color: #ccc; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .suggestion-btn:hover { background: #3f3f3f; color: white; border-color: #19c37d; }

    /* Messages */
    .msg { display: flex; gap: 14px; align-items: flex-start; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { flex-direction: row-reverse; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
    .avatar.ai { background: linear-gradient(135deg, #19c37d, #0ea5e9); color: white; }
    .avatar.user { background: linear-gradient(135deg, #7c3aed, #5436da); color: white; }
    .msg-content { max-width: 75%; display: flex; flex-direction: column; gap: 4px; }
    .bubble { padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.7; word-break: break-word; }
    .msg.ai .bubble { background: #2f2f2f; border-radius: 4px 16px 16px 16px; }
    .msg.user .bubble { background: #2f2f2f; border-radius: 16px 4px 16px 16px; }

    /* Markdown */
    .bubble h1,.bubble h2,.bubble h3 { margin: 12px 0 6px; color: white; font-weight: 600; }
    .bubble h1 { font-size: 20px; } .bubble h2 { font-size: 17px; } .bubble h3 { font-size: 15px; }
    .bubble p { margin: 6px 0; }
    .bubble ul,.bubble ol { margin: 8px 0 8px 20px; }
    .bubble li { margin: 4px 0; }
    .bubble strong { color: #19c37d; font-weight: 600; }
    .bubble em { color: #a78bfa; }
    .bubble code { background: #1a1a1a; color: #f59e0b; padding: 2px 7px; border-radius: 5px; font-family: 'Courier New', monospace; font-size: 13px; }
    .bubble pre { background: #1a1a1a; border: 1px solid #3f3f3f; padding: 14px; border-radius: 10px; overflow-x: auto; margin: 10px 0; }
    .bubble pre code { background: none; color: #e2e8f0; padding: 0; }
    .bubble blockquote { border-left: 3px solid #19c37d; padding-left: 12px; margin: 8px 0; color: #999; }
    .bubble a { color: #19c37d; text-decoration: none; }
    .bubble a:hover { text-decoration: underline; }
    .bubble img { max-width: 100%; border-radius: 8px; margin: 8px 0; display: block; }
    .file-tag { display: inline-block; background: #3f3f3f; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #ccc; margin-top: 6px; }

    /* Typing cursor */
    .cursor { display: inline-block; width: 2px; height: 16px; background: #19c37d; margin-left: 2px; animation: blink 0.7s infinite; vertical-align: middle; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    /* Thinking dots */
    .thinking { display: flex; gap: 5px; padding: 14px 16px; background: #2f2f2f; border-radius: 4px 16px 16px 16px; width: fit-content; }
    .thinking span { width: 8px; height: 8px; background: #19c37d; border-radius: 50%; animation: bounce 1.2s infinite; }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }

    /* Input area */
    .input-wrapper { padding: 12px 20%; background: #212121; }
    .input-box { background: #2f2f2f; border-radius: 16px; padding: 12px 16px; border: 1px solid #3f3f3f; transition: border 0.2s; }
    .input-box:focus-within { border-color: #19c37d55; }
    .preview-area { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .preview-item { position: relative; }
    .preview-item img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
    .preview-item .remove { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; cursor: pointer; }
    .input-top { display: flex; align-items: flex-end; gap: 8px; }
    .input-top textarea { flex: 1; background: transparent; border: none; color: white; font-size: 15px; outline: none; resize: none; font-family: 'Segoe UI', sans-serif; max-height: 120px; line-height: 1.5; padding: 4px 0; }
    .input-top textarea::placeholder { color: #555; }
    .send-btn { background: #19c37d; border: none; color: white; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
    .send-btn:hover { background: #16a066; transform: scale(1.05); }
    .send-btn:disabled { background: #3f3f3f; color: #555; cursor: not-allowed; transform: none; }

    /* Bottom toolbar */
    .input-bottom { display: flex; align-items: center; gap: 2px; margin-top: 10px; }
    .tool-btn { background: none; border: none; color: #666; font-size: 15px; cursor: pointer; padding: 6px 8px; border-radius: 8px; display: flex; align-items: center; gap: 5px; font-family: 'Segoe UI', sans-serif; font-size: 13px; transition: all 0.2s; white-space: nowrap; }
    .tool-btn:hover { background: #3f3f3f; color: #ececec; }
    .tool-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Mic button — Claude style */
    .mic-wrap { margin-left: auto; position: relative; }
    .mic-btn { background: none; border: none; color: #666; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .mic-btn:hover { background: #3f3f3f; color: #ececec; }
    .mic-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .mic-btn.active { color: white; background: #ef4444; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 #ef444466; } 70% { box-shadow: 0 0 0 10px #ef444400; } 100% { box-shadow: 0 0 0 0 #ef444400; } }
    .mic-btn.active svg { stroke: white; }
    .rec-label { position: absolute; top: -22px; right: 0; background: #ef4444; color: white; font-size: 10px; padding: 2px 7px; border-radius: 10px; white-space: nowrap; display: none; }
    .mic-btn.active ~ .rec-label { display: block; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-title">⚡ KelivaX</div>
  <button class="new-chat" onclick="newChat()">✏️ &nbsp; New Chat</button>
  <div class="sidebar-footer">Powered by Anshal</div>
</div>

<div class="main">
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <h1>KelivaX</h1>
      <p>How can I help you today?</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="suggest(this)">💡 Give me some idea</button>
        <button class="suggestion-btn" onclick="suggest(this)">📝 Help with writing</button>
        <button class="suggestion-btn" onclick="suggest(this)">🔍 Explain something</button>
        <button class="suggestion-btn" onclick="suggest(this)">💻 Help with writing code</button>
      </div>
    </div>
  </div>

  <div class="input-wrapper">
    <div class="input-box">
      <div class="preview-area" id="previewArea"></div>
      <div class="input-top">
        <textarea id="userInput" rows="1" placeholder="Search anything..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMsg()" title="Send">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
      <div class="input-bottom">

        <!-- + button with dropdown -->
        <div style="position:relative">
          <button class="tool-btn" onclick="toggleDropdown()" id="plusBtn" title="Attach">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <div id="dropdown" style="display:none;position:absolute;bottom:44px;left:0;background:#1a1a1a;border:1px solid #3f3f3f;border-radius:12px;padding:6px;min-width:160px;z-index:99;box-shadow:0 8px 24px #0008;">
            <button class="tool-btn" style="width:100%;justify-content:flex-start;gap:10px;padding:8px 12px;" onclick="document.getElementById('imgInput').click();closeDropdown()">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              Image
            </button>
            <button class="tool-btn" style="width:100%;justify-content:flex-start;gap:10px;padding:8px 12px;" onclick="document.getElementById('fileInput').click();closeDropdown()">
              <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              File
            </button>
            <button class="tool-btn" style="width:100%;justify-content:flex-start;gap:10px;padding:8px 12px;" onclick="document.getElementById('videoInput').click();closeDropdown()">
              <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
              Video
            </button>
          </div>
        </div>

        <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleImage(event)">
        <input type="file" id="fileInput" accept=".pdf,.txt,.doc,.docx,.csv" style="display:none" onchange="handleFile(event)">
        <input type="file" id="videoInput" accept="video/*" style="display:none" onchange="handleVideo(event)">

        <!-- Mic button — Claude style -->
        <div class="mic-wrap">
          <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Voice se bolo">
            <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
          </button>
          <span class="rec-label">● REC</span>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
const GROQ_KEY = "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";
let history = [];
let attachments = [];
let mediaRecorder = null;
let isRecording = false;
let audioChunks = [];

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function suggest(btn) {
  document.getElementById('userInput').value = btn.textContent.slice(2).trim();
  sendMsg();
}
function toggleDropdown() {
  const d = document.getElementById('dropdown');
  d.style.display = d.style.display === 'none' ? 'block' : 'none';
}
function closeDropdown() {
  document.getElementById('dropdown').style.display = 'none';
}
document.addEventListener('click', e => {
  if (!e.target.closest('#plusBtn') && !e.target.closest('#dropdown')) closeDropdown();
});

async function sendMsg() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text && attachments.length === 0) return;
  document.getElementById('welcome')?.remove();

  let userContent = text;
  if (attachments.length > 0) {
    userContent += attachments.map(a => a.text ? '\n[File: ' + a.name + ']\n' + a.text : '\n[' + a.type + ': ' + a.name + ']').join('');
  }
  addMsg(text || '📎 Attachment', 'user', [...attachments]);
  history.push({ role: 'user', content: userContent });
  input.value = ''; input.style.height = 'auto';
  attachments = [];
  document.getElementById('previewArea').innerHTML = '';

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  const thinkId = addThinking();

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_KEY },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [{ role: 'system', content: 'You are KelivaX, a helpful and friendly AI assistant. Always respond in the same language the user writes in. If user writes in Hindi, respond in Hindi. If user writes in English, respond in English. Give detailed, well-formatted answers using markdown. Use relevant emojis naturally in your responses to make them more engaging and friendly.'],
        max_tokens: 2048
      })
    });
    const data = await res.json();
    removeThinking(thinkId);
    const reply = data.choices[0].message.content;
    history.push({ role: 'assistant', content: reply });
    await typeMsg(reply);
  } catch(e) {
    removeThinking(thinkId);
    addMsg('❌ Error occourred, Please try again!', 'ai');
  }
  btn.disabled = false;
}

function addThinking() {
  const area = document.getElementById('chatArea');
  const id = 'think_' + Date.now();
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = id;
  div.innerHTML = `<div class="avatar ai">K</div><div class="thinking"><span></span><span></span><span></span></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return id;
}
function removeThinking(id) { document.getElementById(id)?.remove(); }

async function typeMsg(text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ai';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  div.innerHTML = `<div class="avatar ai">K</div>`;
  div.appendChild(bubble);
  area.appendChild(div);
  let i = 0;
  return new Promise(resolve => {
    function type() {
      if (i < text.length) {
        bubble.innerHTML = marked.parse(text.slice(0, i + 1)) + '<span class="cursor"></span>';
        i += 4;
        area.scrollTop = area.scrollHeight;
        setTimeout(type, 6);
      } else {
        bubble.innerHTML = marked.parse(text);
        resolve();
      }
    }
    type();
  });
}

function addMsg(text, type, atts = []) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  let attHtml = '';
  atts.forEach(a => {
    if (a.type === 'image') attHtml += `<br><img src="${a.url}" style="max-width:200px;border-radius:8px;margin-top:8px">`;
    else attHtml += `<br><span class="file-tag">📎 ${a.name}</span>`;
  });
  const content = type === 'ai' ? marked.parse(text) : text;
  div.innerHTML = `<div class="avatar ${type}">${type === 'ai' ? 'K' : 'U'}</div><div class="msg-content"><div class="bubble">${content}${attHtml}</div></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function handleImage(e) {
  const file = e.target.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  attachments.push({ type: 'image', name: file.name, url });
  document.getElementById('previewArea').innerHTML += `<div class="preview-item"><img src="${url}"><button class="remove" onclick="this.parentNode.remove()">×</button></div>`;
}
function handleFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    attachments.push({ type: 'file', name: file.name, text: ev.target.result });
    document.getElementById('previewArea').innerHTML += `<div class="preview-item"><span class="file-tag">📎 ${file.name}</span></div>`;
  };
  reader.readAsText(file);
}
function handleVideo(e) {
  const file = e.target.files[0]; if (!file) return;
  attachments.push({ type: 'video', name: file.name });
  document.getElementById('previewArea').innerHTML += `<div class="preview-item"><span class="file-tag">🎥 ${file.name}</span></div>`;
}

async function toggleMic() {
  const btn = document.getElementById('micBtn');
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const formData = new FormData();
        formData.append('file', blob, 'voice.webm');
        formData.append('model', 'whisper-large-v3');
        try {
          const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
            method: 'POST', headers: { 'Authorization': 'Bearer ' + GROQ_KEY }, body: formData
          });
          const data = await res.json();
          document.getElementById('userInput').value = data.text || '';
          autoResize(document.getElementById('userInput'));
        } catch(e) { alert('Voice error!'); }
      };
      mediaRecorder.start();
      isRecording = true;
      btn.classList.add('active');
    } catch(e) { alert('Give permission in the browser!'); }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove('active');
  }
}

function newChat() {
  history = []; attachments = [];
  document.getElementById('chatArea').innerHTML = `<div class="welcome" id="welcome"><h1>KelivaX AI</h1><p>Aaj main aapki kya madad kar sakta hu?</p><div class="suggestions"><button class="suggestion-btn" onclick="suggest(this)">💡 Koi idea do</button><button class="suggestion-btn" onclick="suggest(this)">📝 Likhne mein help karo</button><button class="suggestion-btn" onclick="suggest(this)">🔍 Kuch explain karo</button><button class="suggestion-btn" onclick="suggest(this)">💻 Code likhne mein help karo</button></div></div>`;
  document.getElementById('previewArea').innerHTML = '';
}
</script>
</body>
</html>
