<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KelivaX AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            color: #00f2fe;
            margin-bottom: 5px;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }
        p.subtitle {
            color: #ccc;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #00f2fe;
            border-radius: 8px;
            box-sizing: border-box;
            resize: none;
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
        }
        textarea:focus {
            outline: none;
            box-shadow: 0 0 10px #00f2fe;
        }
        button {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: 0.3s ease;
        }
        button:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.5);
        }
        #output {
            margin-top: 25px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            text-align: left;
            min-height: 60px;
            white-space: pre-wrap;
            border-left: 4px solid #00f2fe;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>KelivaX</h1>
    <p class="subtitle">Search Beautifully</p>
    
    <textarea id="userInput" placeholder="Ask KelivaX anything..."></textarea>
    <button onclick="askKelivaX()">Generate Response</button>
    
    <div id="output">KelivaX response will appear here...</div>
</div>

<script>
    async function askKelivaX() {
        const input = document.getElementById('userInput').value;
        const outputDiv = document.getElementById('output');
        
        if (!input) {
            alert("Please enter a prompt!");
            return;
        }

        outputDiv.innerText = "KelivaX is thinking...";

        try {
            // Yahan aapke Hugging Face Space ka URL aayega
            const response = await fetch('https://YOUR_HF_USERNAME-kelivax.hf.space/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ data: [input] })
            });

            const result = await response.json();
            outputDiv.innerText = result.data ? result.data[0] : "No response from KelivaX.";
            
        } catch (error) {
            console.error("Error:", error);
            outputDiv.innerText = "Error: Connected to KelivaX backend failed.";
        }
    }
</script>

</body>
</html>
